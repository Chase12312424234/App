[project]
name = "dropfinder"
version = "0.1.0"
description = "Identify every track in a YouTube DJ set, with timestamps."
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default]>=2025.10.22",
    "shazamio>=0.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dropfinder = "dropfinder.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dropfinder*"]
